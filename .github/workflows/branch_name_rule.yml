name: Block PR - Invalid Branch Name

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch
        run: echo "name=${{ github.head_ref }}" >> $GITHUB_OUTPUT

      - name: Validate branch name format
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          
          # Define the pattern: {type}/{description}
          PATTERN="^(feature|bugfix|hotfix|release|docs|chore)/[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          
          if [[ $BRANCH =~ $PATTERN ]]; then
            echo "✅ Branch name is valid: $BRANCH"
            exit 0
          else
            echo "❌ Branch name '$BRANCH' does not match required pattern"
            echo ""
            echo "Required format: {type}/{description}"
            echo "Valid types: feature, bugfix, hotfix, release, docs, chore"
            echo "Description: lowercase letters, numbers, and hyphens"
            echo ""
            echo "Examples:"
            echo "  ✅ feature/user-authentication"
            echo "  ✅ bugfix/login-button-fix"
            echo "  ❌ my-feature (missing type prefix)"
            echo "  ❌ feature/My_Feature (invalid characters)"
            echo ""
            exit 1
          fi

      - name: Comment on failed PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ github.head_ref }}';
            const body = '❌ **Branch name validation failed**\n\n' +
              'Your branch name `' + branch + '` does not follow the naming convention.\n\n' +
              '**Required format:** `{type}/{description}`\n\n' +
              '**Valid types:**\n' +
              '- `feature` - New features\n' +
              '- `bugfix` - Bug fixes\n' +
              '- `hotfix` - Critical production fixes\n' +
              '- `release` - Release branches\n' +
              '- `docs` - Documentation updates\n' +
              '- `chore` - Maintenance tasks\n\n' +

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
